<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مرايا للسفريات والسياحة | الهوية الجديدة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700;800&family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        * { 
            font-family: 'Open Sans', 'Lato', sans-serif; 
            transition: all 0.3s ease;
        }
        
        :root {
            --maraya-dark: #0a2540;
            --maraya-primary: #1a4b8c;
            --maraya-light: #4a8bc2;
            --maraya-sky: #d4e6f1;
            --maraya-gray: #f0f4f8;
            --maraya-white: #ffffff;
        }

        .bg-maraya-gradient { 
            background: linear-gradient(145deg, var(--maraya-dark) 0%, var(--maraya-primary) 60%, var(--maraya-light) 100%);
        }
        .bg-maraya-light-gradient {
            background: linear-gradient(135deg, var(--maraya-gray) 0%, var(--maraya-sky) 100%);
        }
        .bg-maraya-card {
            background: var(--maraya-white);
            border: 1px solid rgba(74, 139, 194, 0.15);
        }

        .glass-effect {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .plane-bg {
            position: absolute;
            opacity: 0.04;
            filter: grayscale(0.5) brightness(1.2);
            pointer-events: none;
            z-index: 0;
        }

        .page-transition { 
            animation: fadeInUp 0.6s cubic-bezier(0.23, 1, 0.32, 1); 
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .service-card, .visa-card {
            transition: all 0.3s ease;
            border-radius: 24px;
            background: var(--maraya-white);
            box-shadow: 0 8px 30px rgba(10, 37, 64, 0.06);
        }
        .service-card:hover, .visa-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 16px 48px rgba(10, 37, 64, 0.12);
        }

        .logo-header {
            height: 44px;
            object-fit: contain;
        }

        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: var(--maraya-primary); border-radius: 20px; }
        
        .approval-icon {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            font-size: 1.4rem;
            flex-shrink: 0;
            color: white;
        }

        /* بطاقات الفروع */
        .branch-card {
            transition: all 0.3s ease;
            border-radius: 24px;
            background: var(--maraya-white);
            box-shadow: 0 8px 30px rgba(10, 37, 64, 0.06);
            border: 1px solid rgba(74, 139, 194, 0.08);
            padding: 1.8rem 1.5rem;
            text-align: center;
        }
        .branch-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 16px 48px rgba(10, 37, 64, 0.12);
            border-color: rgba(74, 139, 194, 0.2);
        }
        .branch-card .branch-icon {
            width: 56px;
            height: 56px;
            background: rgba(26, 75, 140, 0.08);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            color: var(--maraya-primary);
            margin: 0 auto 1rem;
        }
        .branch-card .branch-name {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--maraya-dark);
        }
        .branch-card .branch-address {
            font-size: 0.9rem;
            color: #6b7280;
            margin-top: 0.3rem;
        }
        .branch-card .branch-badge {
            display: inline-block;
            font-size: 0.65rem;
            font-weight: 700;
            padding: 0.2rem 0.8rem;
            border-radius: 50px;
            background: var(--maraya-primary);
            color: white;
            margin-top: 0.3rem;
        }
        /* أيقونات التواصل في البطاقات */
        .branch-social {
            display: flex;
            justify-content: center;
            gap: 0.8rem;
            margin-top: 1rem;
        }
        .branch-social a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: rgba(26, 75, 140, 0.06);
            color: var(--maraya-primary);
            font-size: 1.2rem;
            transition: all 0.3s ease;
            text-decoration: none;
        }
        .branch-social a:hover {
            background: var(--maraya-primary);
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 8px 16px rgba(26, 75, 140, 0.15);
        }
        .branch-social a.whatsapp:hover { background: #25d366; }
        .branch-social a.facebook:hover { background: #1877f2; }
        .branch-social a.instagram:hover { background: #e4405f; }

        /* خريطة مصغرة */
        .map-container {
            width: 100%;
            height: 280px;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 8px 40px rgba(10, 37, 64, 0.08);
            border: 1px solid rgba(74, 139, 194, 0.1);
        }
        .map-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body class="bg-gray-50 overflow-hidden text-gray-800">

<div class="flex h-screen overflow-hidden">
    <!-- Sidebar -->
    <aside id="sidebar" class="fixed md:static top-0 right-0 h-full z-50 w-80 bg-white shadow-2xl transform transition-transform duration-500 translate-x-full md:translate-x-0 flex flex-col border-l border-blue-100">
        <div class="p-8 bg-maraya-gradient text-white text-center relative overflow-hidden">
            <div class="relative z-10 flex flex-col items-center">
                <div class="w-24 h-24 bg-white p-3 rounded-3xl shadow-xl mb-5">
                    <img src="ma.png" alt="شعار مرايا" class="w-full h-full object-contain">
                </div>
                <h1 class="text-2xl font-black tracking-tight">مرايا للسفريات</h1>
                <p class="text-[10px] uppercase tracking-[4px] opacity-80 mt-1">Maraya Travel & Tours</p>
            </div>
            <div class="absolute -bottom-10 -left-10 w-40 h-40 bg-white/5 rounded-full blur-3xl"></div>
        </div>
        
        <div class="flex-1 overflow-y-auto custom-scrollbar p-5">
            <ul id="navList" class="space-y-2"></ul>
        </div>
    </aside>

    <!-- المحتوى الرئيسي -->
    <main class="flex-1 flex flex-col relative overflow-hidden">
        <header class="h-20 glass-effect border-b flex items-center justify-between px-8 lg:px-14 sticky top-0 z-40">
            <button id="openSidebarBtn" class="md:hidden text-blue-900 text-2xl"><i class="fas fa-bars-staggered"></i></button>
            <div id="pageTitle" class="text-xl font-extrabold text-gray-800 flex items-center gap-3"></div>
            <div class="hidden sm:block h-12">
                <img src="ma.png" alt="Maraya" class="h-full object-contain logo-header">
            </div>
        </header>

        <div class="flex-1 overflow-y-auto p-6 md:p-10 relative bg-maraya-light-gradient">
            <i class="fas fa-plane plane-bg text-9xl top-12 left-12 -rotate-45"></i>
            <i class="fas fa-plane plane-bg text-8xl bottom-12 right-12 rotate-12"></i>
            <i class="fas fa-plane plane-bg text-7xl top-1/2 left-1/4 -rotate-12 opacity-20"></i>

            <div id="pageContent" class="max-w-6xl mx-auto min-h-[70vh] relative z-10"></div>
        </div>

        <footer class="h-20 bg-white/90 backdrop-blur-sm border-t flex items-center justify-between px-8 lg:px-14">
            <button id="prevBtn" class="flex items-center gap-2 font-bold text-gray-500 hover:text-blue-700 disabled:opacity-20"><i class="fas fa-chevron-right"></i> السابق</button>
            <div class="flex flex-col items-center">
                <div id="progressBar" class="w-48 h-1.5 bg-gray-200 rounded-full overflow-hidden mb-2">
                    <div id="progressFill" class="h-full bg-gradient-to-l from-blue-700 to-blue-400 w-0"></div>
                </div>
                <span id="pageIndicator" class="text-xs font-bold text-gray-400 uppercase tracking-widest">1 / 18</span>
            </div>
            <button id="nextBtn" class="bg-gradient-to-r from-blue-700 to-blue-500 text-white px-8 py-2.5 rounded-full shadow-lg shadow-blue-200 hover:shadow-xl font-bold flex items-center gap-2">التالي <i class="fas fa-chevron-left"></i></button>
        </footer>
    </main>
</div>

<script>
// ---------- فهرس الصفحات (18 صفحة، تم حذف صفحة التواصل) ----------
const pages = [
    { id: 1, title: "الغلاف الرسمي", icon: "fas fa-home" },
    { id: 2, title: "الرؤية والرسالة", icon: "fas fa-bullseye" },
    { id: 3, title: "خدماتنا", icon: "fas fa-briefcase" },
    { id: 4, title: "تذاكر الطيران", icon: "fas fa-plane" },
    { id: 5, title: "الفنادق والشقق", icon: "fas fa-building" },
    { id: 6, title: "النقل البري", icon: "fas fa-bus" },
    { id: 7, title: "الحج والعمرة", icon: "fas fa-moon" },
    { id: 8, title: "استخراج التأشيرات", icon: "fas fa-globe" },
    { id: 9, title: "تأشيرات السعودية 🇸🇦", icon: "fas fa-passport" },
    { id: 10, title: "موافقات مصر", icon: "fas fa-shield-alt" },
    { id: 11, title: "خدمات الأردن 🇯🇴", icon: "fas fa-lock" },
    { id: 12, title: "القيادة وتأجير السيارات", icon: "fas fa-car" },
    { id: 13, title: "الباقات السياحية", icon: "fas fa-umbrella-beach" },
    { id: 14, title: "خدمات رجال الأعمال", icon: "fas fa-chart-line" },
    { id: 15, title: "المعاملات المحلية 🇾🇪", icon: "fas fa-folder-open" },
    { id: 16, title: "لماذا مرايا؟", icon: "fas fa-star" },
    { id: 17, title: "مكتب كوالالمبور 🇲🇾", icon: "fas fa-tower-observation" },
    // الصفحة 18: فروعنا (أخيراً)
    { id: 18, title: "فروعنا", icon: "fas fa-map-marked-alt" }
];

// ---------- محتوى الصفحات ----------
function getPageHTML(id) {
    switch(id) {
        // الصفحات من 1 إلى 17 (نفس المحتوى السابق، لم يتغير)
        case 1: return `
            <div class="page-transition flex flex-col items-center justify-center text-center p-12 bg-white rounded-[4rem] shadow-2xl border border-blue-50 relative overflow-hidden min-h-[70vh]">
                <div class="w-72 h-72 mb-8 transform hover:scale-105 transition-transform duration-700">
                    <img src="ma.png" alt="marya" class="w-full h-full object-contain">
                </div>
                <h1 class="text-7xl font-black text-blue-900 mb-3 tracking-tight">مرايا للسفريات</h1>
                <p class="text-3xl font-light text-blue-400 tracking-[0.3em] mb-10 uppercase">Maraya Travel & Tours</p>
                <div class="bg-gradient-to-r from-blue-700 to-blue-500 text-white px-10 py-4 rounded-full font-bold shadow-xl shadow-blue-200 text-xl">
                    انعكاسٌ للتميز وجودة الخدمة
                </div>
            </div>`;

        case 2: return `
            <div class="page-transition space-y-12">
                <div class="grid md:grid-cols-2 gap-10">
                    <div class="bg-gradient-to-br from-blue-900 to-blue-700 text-white p-10 rounded-[3rem] shadow-2xl relative overflow-hidden group">
                        <i class="fas fa-eye text-9xl absolute -bottom-8 -left-8 opacity-10 group-hover:scale-110 transition-transform"></i>
                        <h3 class="text-4xl font-black mb-6 flex items-center gap-3"><i class="fas fa-rocket text-blue-300"></i> الرؤية</h3>
                        <p class="text-lg leading-relaxed font-light opacity-90">تهتم وكالة مرايا بالسعي نحو نمو مستدام يستهدف ازدهار مجال السياحة، وبناء اسم رائد في تقديم خدمات السفر في دول مختلفة، مع تعزيز دورها في إنعاش التنمية السياحية المساهمة في دعم الاقتصاد الوطني.</p>
                    </div>
                    <div class="bg-white p-10 rounded-[3rem] shadow-xl border border-gray-100">
                        <h3 class="text-4xl font-black text-blue-900 mb-6 flex items-center gap-3"><i class="fas fa-paper-plane text-blue-600"></i> الرسالة</h3>
                        <p class="text-lg text-gray-700 leading-relaxed italic">الإسهام في تقديم الوعي المجتمعي من خلال نماذج مجربة وناجحة تحقق رؤية الوكالة وأهدافها، وتكفل الجودة والتميز في الخدمات.</p>
                    </div>
                </div>
                <div class="bg-gradient-to-br from-blue-900 to-blue-700 text-white p-12 rounded-[3rem] shadow-2xl">
                    <h3 class="text-3xl font-black mb-8 text-center text-blue-200 underline underline-offset-8">أهدافنا الاستراتيجية</h3>
                    <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
                        ${[
                            'تقديم أفضل العروض المنافسة',
                            'التدريب والاستشارات المستمرة',
                            'صنع الوعي المجتمعي',
                            'تطوير الصناعة السياحية',
                            'تبادل الخبرات الدولية',
                            'تجربة سفر خالية من التعقيدات'
                        ].map((text, i) => `
                            <div class="flex items-center gap-4 bg-white/10 p-5 rounded-2xl hover:bg-white/20 border border-white/10">
                                <i class="fas fa-check-circle text-blue-300 text-2xl"></i>
                                <span class="text-base font-medium">${text}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            </div>`;

        case 3: return `
            <div class="page-transition space-y-12">
                <div class="text-center">
                    <h2 class="text-5xl font-black text-blue-900">خدماتنا</h2>
                    <p class="text-xl text-gray-500 mt-2 font-light">نفهم احتياجك، ونلبيه</p>
                </div>
                <div class="bg-blue-50/60 p-8 rounded-3xl border-r-4 border-blue-400">
                    <p class="text-gray-700 text-lg leading-relaxed">من إصدار التأشيرات وحجز تذاكر السفر، وصولاً لخدمات النقل المحلي والدولي، مرايا معك خطوة بخطوة إلى أن نتأكد أنك راضٍ، بأمان.</p>
                </div>
                <div class="space-y-8">
                    <div class="grid md:grid-cols-2 gap-6">
                        <div class="service-card p-6 flex items-start gap-5">
                            <div class="w-14 h-14 bg-blue-100 rounded-2xl flex items-center justify-center text-blue-600 text-2xl"><i class="fas fa-plane"></i></div>
                            <div><h4 class="text-xl font-bold text-blue-900">حجوزات الطيران</h4><p class="text-gray-600">حجز وإصدار التذاكر على كافة الخطوط المحلية والدولية بأفضل الأسعار.</p></div>
                        </div>
                        <div class="service-card p-6 flex items-start gap-5">
                            <div class="w-14 h-14 bg-blue-100 rounded-2xl flex items-center justify-center text-blue-600 text-2xl"><i class="fas fa-passport"></i></div>
                            <div><h4 class="text-xl font-bold text-blue-900">التأشيرات والسفريات</h4><p class="text-gray-600">سياحية، علاجية، عمل، وزيارة لجميع الوجهات العالمية.</p></div>
                        </div>
                        <div class="service-card p-6 flex items-start gap-5">
                            <div class="w-14 h-14 bg-blue-100 rounded-2xl flex items-center justify-center text-blue-600 text-2xl"><i class="fas fa-hotel"></i></div>
                            <div><h4 class="text-xl font-bold text-blue-900">حجوزات الفنادق</h4><p class="text-gray-600">خيارات إقامة متنوعة تناسب جميع الميزانيات والاحتياجات.</p></div>
                        </div>
                        <div class="service-card p-6 flex items-start gap-5">
                            <div class="w-14 h-14 bg-blue-100 rounded-2xl flex items-center justify-center text-blue-600 text-2xl"><i class="fas fa-shield-alt"></i></div>
                            <div><h4 class="text-xl font-bold text-blue-900">الموافقات الأمنية</h4><p class="text-gray-600">لمختلف الوجهات (مصر، الأردن، وغيرها) بسرعة واحترافية.</p></div>
                        </div>
                        <div class="service-card p-6 flex items-start gap-5">
                            <div class="w-14 h-14 bg-blue-100 rounded-2xl flex items-center justify-center text-blue-600 text-2xl"><i class="fas fa-bus"></i></div>
                            <div><h4 class="text-xl font-bold text-blue-900">النقل البري</h4><p class="text-gray-600">دولي ومحلي بمركبات مريحة وآمنة بأسعار تنافسية.</p></div>
                        </div>
                        <div class="service-card p-6 flex items-start gap-5">
                            <div class="w-14 h-14 bg-blue-100 rounded-2xl flex items-center justify-center text-blue-600 text-2xl"><i class="fas fa-umbrella-beach"></i></div>
                            <div><h4 class="text-xl font-bold text-blue-900">الباقات السياحية</h4><p class="text-gray-600">برامج متكاملة للأفراد والعوائل بأفضل الوجهات العالمية.</p></div>
                        </div>
                    </div>
                    <div class="text-center p-8 bg-gradient-to-r from-blue-600 to-blue-800 rounded-3xl text-white shadow-xl">
                        <p class="text-2xl font-medium">💬 نحن مرايا، نرى طريقك ونضيئه لك. نفهم احتياجك… ونلبيه.</p>
                    </div>
                </div>
            </div>`;

        case 4: return `
            <div class="page-transition space-y-8">
                <div>
                    <h2 class="text-4xl font-black text-blue-900 border-r-4 border-blue-600 pr-4">تذاكر الطيران</h2>
                    <p class="text-lg text-gray-500 mt-2 font-light">احجز عبر الوكيل الرسمي لأكثر من 200 شركة طيران</p>
                </div>
                <div class="bg-blue-50/60 p-8 rounded-3xl border-r-4 border-blue-400">
                    <p class="text-gray-700">بفضل أنظمة الحجز العالمية (Amadeus – Galileo – Babylon – NDC)، ستجد أفضل العروض عبر شبكة علاقات واسعة تسهل سفرك.</p>
                </div>
                <div class="grid md:grid-cols-2 gap-6">
                    ${[
                        ['سهولة الحجز وسرعته','احجز من مكانك عبر الاتصال أو الإنترنت.'],
                        ['أسعار وعروض خاصة','أقل الأسعار مع عروض مميزة طوال العام.'],
                        ['تنوع الخيارات والوجهات','أي وجهة، أي خط جوي، أي درجة تريد.'],
                        ['دعم على مدار الساعة','فريقنا جاهز لمساعدتك في أي وقت.']
                    ].map(([title, desc]) => `
                        <div class="service-card p-6 flex items-start gap-4">
                            <i class="fas fa-check-circle text-blue-500 text-2xl mt-1"></i>
                            <div><h4 class="font-bold text-blue-900 text-lg">${title}</h4><p class="text-gray-600">${desc}</p></div>
                        </div>
                    `).join('')}
                </div>
                <div class="bg-yellow-50 p-6 rounded-2xl border-r-4 border-yellow-400 text-yellow-800"><strong>⚠️ توصية مهمة:</strong> احجز مبكراً لضمان أفضل سعر، خاصة في أوقات الذروة.</div>
                <div class="bg-gray-50 p-6 rounded-2xl border border-gray-200">
                    <h3 class="font-bold text-blue-800 text-lg">🤝 شركاؤنا</h3>
                    <div class="mt-2"><span class="font-semibold">محلي:</span> طيران اليمنية – فلاي عدن – بلقيس</div>
                    <div class="mt-1"><span class="font-semibold">دولي:</span> القطرية، الإماراتية، السعودية، الإثيوبية وغيرها.</div>
                </div>
            </div>`;

        case 5: return `
            <div class="page-transition space-y-8">
                <div>
                    <h2 class="text-4xl font-black text-blue-900 border-r-4 border-blue-600 pr-4">الفنادق والشقق</h2>
                    <p class="text-lg text-gray-500 mt-2 font-light">احزم أمتعتك، ونحن نتولى تجهيز مكان إقامتك</p>
                </div>
                <p class="text-gray-700 bg-white p-8 rounded-3xl shadow-sm border border-blue-50">تشمل خدماتنا الفنادق الفاخرة، الاقتصادية، والعائلية، داخل وخارج اليمن، لإقامة مريحة تليق بك.</p>
                <div class="grid md:grid-cols-2 gap-6">
                    ${[
                        ['أفضل سعر','نتولى البحث عن أفضل عرض يناسب ميزانيتك.','fas fa-tag'],
                        ['خيارات واسعة','أكثر من 200 دولة ومدينة حول العالم.','fas fa-globe'],
                        ['خدمة 24/7','دعم مستمر لإتمام حجزك في أي وقت.','fas fa-clock'],
                        ['حجوزات مؤكدة','ضمان عدم الإلغاء أو التبديل لأي سبب.','fas fa-check-circle']
                    ].map(([title, desc, icon]) => `
                        <div class="service-card p-6 flex items-start gap-4">
                            <i class="${icon} text-blue-500 text-3xl"></i>
                            <div><h4 class="font-bold text-blue-900 text-lg">${title}</h4><p class="text-gray-600">${desc}</p></div>
                        </div>
                    `).join('')}
                </div>
            </div>`;

        case 6: return `

// ---------- منطق التنقل (تم تحديث total إلى 18) ----------
let current = 1;
const total = 18;

function init() {
    const list = document.getElementById('navList');
    pages.forEach(p => {
        const li = document.createElement('li');
        li.innerHTML = `
            <button onclick="goTo(${p.id})" class="nav-item w-full flex items-center gap-4 px-5 py-3.5 rounded-2xl transition hover:bg-blue-50 group ${p.id === current ? 'bg-blue-50 text-blue-900 font-bold border-r-4 border-blue-600' : 'text-gray-600'}">
                ${p.icon ? `<i class="${p.icon} w-6 group-hover:scale-110"></i>` : '<span class="w-6"></span>'}
                <span class="text-sm">${p.title}</span>
            </button>`;
        list.appendChild(li);
    });
    update();
}

function update() {
    document.getElementById('pageContent').innerHTML = getPageHTML(current);
    const iconHtml = pages[current-1].icon ? `<i class="${pages[current-1].icon} ml-2"></i>` : '';
    document.getElementById('pageTitle').innerHTML = `${iconHtml} ${pages[current-1].title}`;
    document.getElementById('pageIndicator').innerText = `${current} / ${total}`;
    document.getElementById('progressFill').style.width = `${(current/total)*100}%`;

    document.querySelectorAll('.nav-item').forEach((btn, i) => {
        if(i+1 === current) btn.classList.add('bg-blue-50', 'text-blue-900', 'font-bold', 'border-r-4', 'border-blue-600');
        else btn.classList.remove('bg-blue-50', 'text-blue-900', 'font-bold', 'border-r-4', 'border-blue-600');
    });

    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    
    prevBtn.disabled = current === 1;
    
    if (current === total) {
        nextBtn.innerHTML = `<i class="fas fa-rotate-right ml-2"></i> العودة للبداية`;
        nextBtn.onclick = () => { goTo(1); };
        nextBtn.disabled = false;
    } else {
        nextBtn.innerHTML = `التالي <i class="fas fa-chevron-left"></i>`;
        nextBtn.onclick = () => { if (current < total) { current++; update(); } };
        nextBtn.disabled = false;
    }

    document.querySelector('.overflow-y-auto').scrollTop = 0;
}

function goTo(id) { 
    current = id; 
    update(); 
    if(window.innerWidth < 768) toggleSidebar(); 
}

function toggleSidebar() { 
    document.getElementById('sidebar').classList.toggle('translate-x-full'); 
}

document.getElementById('prevBtn').onclick = () => { if(current > 1) { current--; update(); } };
document.getElementById('openSidebarBtn').onclick = toggleSidebar;

document.addEventListener('click', function(e) {
    const sidebar = document.getElementById('sidebar');
    const openBtn = document.getElementById('openSidebarBtn');
    if (window.innerWidth < 768) {
        if (!sidebar.contains(e.target) && !openBtn.contains(e.target)) {
            sidebar.classList.add('translate-x-full');
        }
    }
});

init();
</script>
